<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>巡检记录查询</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');
    body { font-family: 'Noto Sans SC', sans-serif; }
    .sidebar-item:hover { background-color: rgba(255,255,255,0.05); }
    .sidebar-item.active { background-color: #4165EC; color: white; }
    .top-nav-item { position: relative; }
    .top-nav-item.active::after {
      content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 2px; background: #4165EC;
    }
    .ant-btn-primary { background: #4165EC; border-color: #4165EC; }
    .ant-btn-primary:hover { background: #3656c9; border-color: #3656c9; }
    .ant-tag-green { color: #52c41a; background: #f6ffed; border: 1px solid #b7eb8f; }
    .ant-tag-red { color: #ff4d4f; background: #fff1f0; border: 1px solid #ffa39e; }
    .ant-tag-orange { color: #fa8c16; background: #fff7e6; border: 1px solid #ffd591; }
    .ant-tag-blue { color: #1890ff; background: #e6f7ff; border: 1px solid #91d5ff; }
    .score-stars { color: #faad14; }
    .modal-mask { background: rgba(0,0,0,0.45); }
  </style>
</head>
<body class="bg-gray-100 h-screen overflow-hidden">
  <div class="flex h-full">
    <!-- 左侧菜单 -->
    <aside class="w-48 bg-[#001529] text-gray-300 flex flex-col flex-shrink-0">
      <div class="h-14 flex items-center px-4 text-white font-bold text-lg border-b border-gray-700">
        <i class="fas fa-city mr-2"></i>智慧园区
      </div>
      <nav class="flex-1 overflow-y-auto py-2 text-sm">
        <div class="sidebar-item px-4 py-3 cursor-pointer flex items-center"><i class="fas fa-sitemap w-5"></i>人员组织</div>
        <div class="sidebar-item px-4 py-3 cursor-pointer flex items-center"><i class="fas fa-copyright w-5"></i>品牌库管理</div>
        <div>
          <div class="sidebar-item px-4 py-3 cursor-pointer flex items-center justify-between">
            <span><i class="fas fa-clipboard-check w-5"></i>巡检管理</span>
            <i class="fas fa-chevron-down text-xs"></i>
          </div>
          <div class="bg-[#000c17]">
            <div class="sidebar-item px-8 py-2 cursor-pointer">巡检看板</div>
            <div class="sidebar-item px-8 py-2 cursor-pointer">巡检计划</div>
            <div class="sidebar-item px-8 py-2 cursor-pointer">巡检任务</div>
            <div class="sidebar-item active px-8 py-2 cursor-pointer">巡检记录查询</div>
            <div class="sidebar-item px-8 py-2 cursor-pointer">隐患上报</div>
          </div>
        </div>
        <div class="sidebar-item px-4 py-3 cursor-pointer flex items-center"><i class="fas fa-leaf w-5"></i>绿化管理</div>
        <div class="sidebar-item px-4 py-3 cursor-pointer flex items-center"><i class="fas fa-seedling w-5"></i>绿植管理</div>
        <div class="sidebar-item px-4 py-3 cursor-pointer flex items-center"><i class="fas fa-graduation-cap w-5"></i>知识培训</div>
        <div class="sidebar-item px-4 py-3 cursor-pointer flex items-center"><i class="fas fa-warehouse w-5"></i>仓储管理</div>
        <div class="sidebar-item px-4 py-3 cursor-pointer flex items-center"><i class="fas fa-file-contract w-5"></i>物业合同</div>
        <div class="sidebar-item px-4 py-3 cursor-pointer flex items-center"><i class="fas fa-clipboard-list w-5"></i>问卷调查</div>
      </nav>
    </aside>

    <!-- 右侧主区域 -->
    <div class="flex-1 flex flex-col min-w-0">
      <!-- 顶部导航 -->
      <header class="h-14 bg-white border-b border-gray-200 flex items-center justify-between px-4 flex-shrink-0">
        <div class="flex items-center text-sm text-gray-600">
          <i class="fas fa-bars mr-3 cursor-pointer"></i>
          <span class="mr-2"><i class="fas fa-home mr-1"></i>物业管理</span>
          <span class="mx-1">/</span>
          <span class="mr-2">巡检管理</span>
          <span class="mx-1">/</span>
          <span class="font-medium text-gray-800">巡检记录查询</span>
        </div>
        <div class="flex items-center text-sm text-gray-600">
          <span class="mr-4 text-blue-600 cursor-pointer"><i class="far fa-comment-dots mr-1"></i>意见反馈</span>
          <span class="mr-4 cursor-pointer"><i class="fas fa-download mr-1"></i>下载中继插件</span>
          <i class="far fa-bell mr-4 text-lg"></i>
          <div class="flex items-center cursor-pointer">
            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=admin" class="w-7 h-7 rounded-full mr-2" alt="">
            <span>admin</span>
            <i class="fas fa-chevron-down ml-2 text-xs"></i>
          </div>
        </div>
      </header>

      <!-- 二级 Tab -->
      <div class="h-10 bg-white border-b border-gray-200 flex items-center px-2 text-sm text-gray-600 flex-shrink-0">
        <div class="top-nav-item px-4 h-full flex items-center cursor-pointer"><i class="fas fa-home mr-1"></i>首页</div>
        <div class="top-nav-item px-4 h-full flex items-center cursor-pointer">实时告警</div>
        <div class="top-nav-item px-4 h-full flex items-center cursor-pointer">告警档案</div>
        <div class="top-nav-item px-4 h-full flex items-center cursor-pointer">安防设备</div>
        <div class="top-nav-item px-4 h-full flex items-center cursor-pointer">实时告警</div>
        <div class="top-nav-item px-4 h-full flex items-center cursor-pointer">巡检看板</div>
        <div class="top-nav-item px-4 h-full flex items-center cursor-pointer">巡检计划</div>
        <div class="top-nav-item px-4 h-full flex items-center cursor-pointer">巡检任务</div>
        <div class="top-nav-item active px-4 h-full flex items-center cursor-pointer text-blue-600 font-medium">巡检记录查询</div>
        <div class="top-nav-item px-4 h-full flex items-center cursor-pointer">隐患上报</div>
        <div class="top-nav-item px-4 h-full flex items-center cursor-pointer bg-blue-600 text-white rounded ml-1"><i class="fas fa-plus mr-1"></i>新建巡检任务</div>
        <div class="flex-1"></div>
        <div class="px-3"><i class="fas fa-cog text-gray-500"></i></div>
        <div class="px-3"><i class="fas fa-expand text-gray-500"></i></div>
      </div>

      <!-- 内容区 -->
      <main class="flex-1 overflow-auto p-4">
        <div class="bg-white rounded-sm shadow-sm">
          <!-- 标题 -->
          <div class="px-4 py-3 border-b border-gray-200 font-bold text-gray-800">巡检记录查询</div>

          <!-- 筛选栏 -->
          <div class="p-4 border-b border-gray-200 flex flex-wrap items-center gap-4 text-sm">
            <div class="flex items-center">
              <span class="text-gray-600 mr-2">执行人员</span>
              <select class="border border-gray-300 rounded px-2 py-1 w-36 text-gray-600 focus:outline-none focus:border-blue-500">
                <option>请选择执行人员</option>
                <option>巡更员 1</option>
                <option>巡更员 2</option>
              </select>
            </div>
            <div class="flex items-center">
              <span class="text-gray-600 mr-2">巡检状态</span>
              <select class="border border-gray-300 rounded px-2 py-1 w-28 text-gray-600 focus:outline-none focus:border-blue-500">
                <option>已巡检</option>
                <option>未巡检</option>
                <option>巡检中</option>
                <option>已超时</option>
              </select>
            </div>
            <div class="flex items-center">
              <span class="text-gray-600 mr-2">任务时间</span>
              <div class="flex items-center border border-gray-300 rounded px-2 py-1">
                <i class="far fa-calendar-alt text-gray-400 mr-1"></i>
                <input type="text" value="开始" class="w-12 text-gray-600 focus:outline-none text-center">
                <span class="mx-1 text-gray-400">至</span>
                <input type="text" value="结束" class="w-12 text-gray-600 focus:outline-none text-center">
              </div>
            </div>
            <div class="flex items-center ml-auto gap-2">
              <button class="ant-btn-primary text-white px-4 py-1.5 rounded text-sm flex items-center"><i class="fas fa-search mr-1"></i>搜索</button>
              <button class="border border-gray-300 text-gray-600 px-4 py-1.5 rounded text-sm flex items-center bg-white hover:border-gray-400"><i class="fas fa-redo mr-1"></i>重置</button>
            </div>
          </div>

          <!-- 表格 -->
          <div class="p-4 overflow-x-auto">
            <table class="w-full text-sm text-left border-collapse">
              <thead>
                <tr class="bg-gray-50 text-gray-600">
                  <th class="border border-gray-200 px-3 py-2 font-medium w-12 text-center">序号</th>
                  <th class="border border-gray-200 px-3 py-2 font-medium">ID</th>
                  <th class="border border-gray-200 px-3 py-2 font-medium">巡检点</th>
                  <th class="border border-gray-200 px-3 py-2 font-medium">巡检手台</th>
                  <th class="border border-gray-200 px-3 py-2 font-medium">巡检人员</th>
                  <th class="border border-gray-200 px-3 py-2 font-medium text-center">状态</th>
                  <th class="border border-gray-200 px-3 py-2 font-medium">巡检计划时间</th>
                  <th class="border border-gray-200 px-3 py-2 font-medium">计划创建时间</th>
                  <th class="border border-gray-200 px-3 py-2 font-medium">最近更新时间</th>
                  <th class="border border-gray-200 px-3 py-2 font-medium text-center">评分结果</th>
                  <th class="border border-gray-200 px-3 py-2 font-medium text-center w-36">操作</th>
                </tr>
              </thead>
              <tbody id="recordTable" class="text-gray-700">
                <!-- JS 填充 -->
              </tbody>
            </table>
          </div>

          <!-- 分页 -->
          <div class="p-4 border-t border-gray-200 flex items-center justify-end text-sm text-gray-600">
            <span class="mr-4">共 7 条</span>
            <div class="flex items-center gap-1">
              <button class="px-2 py-1 border border-gray-300 rounded hover:border-blue-500 disabled:opacity-50" disabled><i class="fas fa-chevron-left"></i></button>
              <button class="px-3 py-1 border border-blue-500 bg-blue-600 text-white rounded">1</button>
              <button class="px-2 py-1 border border-gray-300 rounded hover:border-blue-500"><i class="fas fa-chevron-right"></i></button>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- 评分弹窗 -->
  <div id="scoreModal" class="fixed inset-0 modal-mask hidden items-center justify-center z-50">
    <div class="bg-white rounded shadow-lg w-[480px]">
      <div class="px-4 py-3 border-b border-gray-200 flex items-center justify-between">
        <span class="font-bold text-gray-800">巡检点评分</span>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button>
      </div>
      <div class="p-5">
        <div class="mb-4">
          <label class="block text-sm text-gray-600 mb-1">巡检点</label>
          <input id="modalPoint" type="text" readonly class="w-full border border-gray-300 rounded px-3 py-2 bg-gray-50 text-gray-700 text-sm">
        </div>
        <div class="mb-4">
          <label class="block text-sm text-gray-600 mb-1">高发问题 <span class="text-red-500">*</span></label>
          <textarea id="modalIssues" rows="3" placeholder="请输入该巡检点的高发问题，多个问题用换行分隔" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500"></textarea>
        </div>
        <div class="mb-2">
          <label class="block text-sm text-gray-600 mb-1">风险评分 <span class="text-red-500">*</span></label>
          <div class="flex items-center gap-2" id="starContainer">
            <!-- 星星 -->
          </div>
          <p class="text-xs text-gray-400 mt-1">分数越高，表示该巡检点风险越高（1-5 分）</p>
        </div>
      </div>
      <div class="px-4 py-3 border-t border-gray-200 flex justify-end gap-2">
        <button onclick="closeModal()" class="px-4 py-1.5 border border-gray-300 rounded text-sm text-gray-600 hover:border-gray-400 bg-white">取消</button>
        <button onclick="saveScore()" class="px-4 py-1.5 ant-btn-primary text-white rounded text-sm">确定</button>
      </div>
    </div>
  </div>

  <script>
    const records = [
      { id: '8791251', point: '东区地库 11', device: '1102', person: '巡更员 2（东区地库）', status: '已巡检', planTime: '2026-08-28 17:00:00', createTime: '2026-08-12 14:25:09', updateTime: '2026-08-12 14:25:09', score: null, issues: '' },
      { id: '8791250', point: '东区地库 11', device: '1102', person: '巡更员 2（东区地库）', status: '已巡检', planTime: '2026-08-28 11:00:00', createTime: '2026-08-12 14:25:09', updateTime: '2026-08-12 14:25:09', score: 4, issues: '照明灯故障、地面渗水' },
      { id: '8791249', point: '东区地库 11', device: '1102', person: '巡更员 2（东区地库）', status: '已巡检', planTime: '2026-08-28 05:00:00', createTime: '2026-08-12 14:25:09', updateTime: '2026-08-12 14:25:09', score: 2, issues: '标识模糊' },
      { id: '8791247', point: '东区地库 11', device: '1102', person: '巡更员 2（东区地库）', status: '已巡检', planTime: '2026-08-27 17:00:00', createTime: '2026-08-12 14:25:09', updateTime: '2026-08-12 14:25:09', score: 5, issues: '消防栓遮挡、排烟风机异响、应急灯失效' },
      { id: '8791245', point: '东区地库 11', device: '1102', person: '巡更员 2（东区地库）', status: '已巡检', planTime: '2026-08-27 05:00:00', createTime: '2026-08-12 14:25:09', updateTime: '2026-08-12 14:25:09', score: null, issues: '' },
      { id: '8791244', point: '东区地库 11', device: '1102', person: '巡更员 2（东区地库）', status: '已巡检', planTime: '2026-08-26 23:00:00', createTime: '2026-08-12 14:25:09', updateTime: '2026-08-12 14:25:09', score: 3, issues: '通道堆放杂物' },
      { id: '8791243', point: '东区地库 11', device: '1102', person: '巡更员 2（东区地库）', status: '已巡检', planTime: '2026-08-26 17:00:00', createTime: '2026-08-12 14:25:09', updateTime: '2026-08-12 14:25:09', score: 1, issues: '墙面小广告' },
    ];

    let currentIndex = null;
    let currentScore = 0;

    function renderStars(score, interactive = false, containerId = 'starContainer') {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      for (let i = 1; i <= 5; i++) {
        const star = document.createElement('i');
        star.className = i <= score ? 'fas fa-star score-stars text-lg cursor-pointer' : 'far fa-star text-gray-300 text-lg cursor-pointer';
        if (interactive) {
          star.onclick = () => { currentScore = i; renderStars(currentScore, true); };
        }
        container.appendChild(star);
      }
    }

    function scoreLabel(score) {
      if (score === null || score === undefined || score === '') return '<span class="text-gray-400">-</span>';
      let label = '';
      if (score >= 4) label = '<span class="ant-tag-red px-1 rounded text-xs mr-1">高风险</span>';
      else if (score >= 2) label = '<span class="ant-tag-orange px-1 rounded text-xs mr-1">中风险</span>';
      else label = '<span class="ant-tag-green px-1 rounded text-xs mr-1">低风险</span>';
      let stars = '';
      for (let i = 1; i <= 5; i++) {
        stars += i <= score ? '<i class="fas fa-star score-stars text-xs"></i>' : '<i class="far fa-star text-gray-300 text-xs"></i>';
      }
      return `<div class="flex flex-col items-center"><div class="mb-0.5">${stars}</div><div>${label}<span class="text-gray-700">${score}分</span></div></div>`;
    }

    function renderTable() {
      const tbody = document.getElementById('recordTable');
      tbody.innerHTML = records.map((r, i) => `
        <tr class="hover:bg-gray-50">
          <td class="border border-gray-200 px-3 py-3 text-center">${i + 1}</td>
          <td class="border border-gray-200 px-3 py-3">${r.id}</td>
          <td class="border border-gray-200 px-3 py-3">${r.point}</td>
          <td class="border border-gray-200 px-3 py-3">${r.device}</td>
          <td class="border border-gray-200 px-3 py-3">${r.person}</td>
          <td class="border border-gray-200 px-3 py-3 text-center"><span class="ant-tag-green px-2 py-0.5 rounded text-xs">${r.status}</span></td>
          <td class="border border-gray-200 px-3 py-3">${r.planTime.replace(' ', '<br>')}</td>
          <td class="border border-gray-200 px-3 py-3">${r.createTime.replace(' ', '<br>')}</td>
          <td class="border border-gray-200 px-3 py-3">${r.updateTime.replace(' ', '<br>')}</td>
          <td class="border border-gray-200 px-3 py-3 text-center">${scoreLabel(r.score)}</td>
          <td class="border border-gray-200 px-3 py-3 text-center">
            <button class="text-blue-600 hover:text-blue-800 mr-2"><i class="far fa-eye"></i> 查看</button>
            <button onclick="openScore(${i})" class="text-orange-500 hover:text-orange-700"><i class="far fa-star"></i> ${r.score !== null && r.score !== '' ? '重新评分' : '评分'}</button>
          </td>
        </tr>
      `).join('');
    }

    function openScore(index) {
      currentIndex = index;
      currentScore = records[index].score || 0;
      document.getElementById('modalPoint').value = records[index].point;
      document.getElementById('modalIssues').value = records[index].issues || '';
      renderStars(currentScore, true);
      document.getElementById('scoreModal').classList.remove('hidden');
      document.getElementById('scoreModal').classList.add('flex');
    }

    function closeModal() {
      document.getElementById('scoreModal').classList.add('hidden');
      document.getElementById('scoreModal').classList.remove('flex');
      currentIndex = null;
      currentScore = 0;
    }

    function saveScore() {
      const issues = document.getElementById('modalIssues').value.trim();
      if (!issues) { alert('请输入高发问题'); return; }
      if (currentScore === 0) { alert('请选择风险评分'); return; }
      records[currentIndex].issues = issues;
      records[currentIndex].score = currentScore;
      renderTable();
      closeModal();
    }

    renderTable();
    renderStars(0, true);
  </script>
</body>
</html>
