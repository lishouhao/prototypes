<script data-page-node-id="aSxqic3bGgtJf2JPywB2Bj">

// 工单名称下拉多选（支持模糊查询）
(function(){
  var ms = document.getElementById('nameMs');
  if(!ms) return;
  var box = ms.querySelector('.ms-box');
  var tagsEl = document.getElementById('nameTags');
  var placeholder = document.getElementById('namePlaceholder');
  var list = ms.querySelectorAll('.ms-li');
  var searchInput = document.getElementById('nameSearch');
  var ALL = ['水管漏水维修','电路故障检修','空调不制冷','门窗损坏维修','照明灯更换','网络故障处理','电梯异常报修','卫生间堵塞','墙面脱落修复','消防设施检查','门锁损坏维修','地面破损修复'];
  var selected = new Set(ALL); // 默认全选 = 不限制

  function render(){
    if(tagsEl) tagsEl.innerHTML = '';
    if(selected.size === 0 || selected.size === ALL.length){
      if(placeholder){ placeholder.style.display = ''; placeholder.textContent = '全部工单名称'; }
    } else {
      if(placeholder) placeholder.style.display = 'none';
      selected.forEach(function(v){
        var t = document.createElement('span');
        t.className = 'ms-tag';
        t.innerHTML = v + '<span class="x" data-v="'+v+'">×</span>';
        if(tagsEl) tagsEl.appendChild(t);
      });
    }
    list.forEach(function(li){
      var v = li.getAttribute('data-v');
      var cb = li.querySelector('input');
      if(cb) cb.checked = (v === '__all__') ? (selected.size === ALL.length) : selected.has(v);
    });
  }

  if(box){
    box.addEventListener('click', function(e){
      if(e.target.classList.contains('x')){
        selected.delete(e.target.getAttribute('data-v'));
        render();
        e.stopPropagation();
        return;
      }
      ms.classList.toggle('open');
    });
  }

  list.forEach(function(li){
    li.addEventListener('click', function(e){
      e.stopPropagation();
      var v = li.getAttribute('data-v');
      var cb = li.querySelector('input');
      if(v === '__all__'){
        selected = cb.checked ? new Set(ALL) : new Set();
      } else {
        if(cb.checked){ selected.add(v); } else { selected.delete(v); }
      }
      render();
    });
  });

  document.addEventListener('click', function(e){
    if(ms && !ms.contains(e.target)){ ms.classList.remove('open'); }
  });

  if(searchInput){
    searchInput.addEventListener('input', function(){
      var q = this.value.trim();
      list.forEach(function(li){
        var v = li.getAttribute('data-v');
        if(v === '__all__'){ li.style.display = ''; return; }
        li.style.display = v.indexOf(q) >= 0 ? '' : 'none';
      });
    });
  }

  render();

  // 暴露重置钩子：还原工单名称为「全部工单名称」（全选）
  window.__resetNameSelect = function(){
    selected = new Set(ALL);
    if(searchInput) searchInput.value = '';
    ms.classList.remove('open');
    list.forEach(function(li){ li.style.display = ''; });
    render();
  };
})();

// 重置按钮：仅还原筛选控件为默认态（原型为静态演示，不触发后台筛选）
(function(){
  var btn = document.getElementById('resetBtn');
  if(!btn) return;
  btn.addEventListener('click', function(){
    var ds = document.getElementById('dateStart');
    var de = document.getElementById('dateEnd');
    if(ds) ds.value = '2025-10-01';
    if(de) de.value = '2026-09-30';
    if(window.__resetNameSelect) window.__resetNameSelect();
  });
})();
</script>
