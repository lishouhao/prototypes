<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>告警处置配置 - 智慧园区</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: #f0f2f5;
      color: rgba(0, 0, 0, 0.85);
    }
    .layout {
      display: flex;
      min-height: 100vh;
    }
    .sidebar {
      width: 208px;
      background: #001529;
      color: rgba(255, 255, 255, 0.65);
      flex-shrink: 0;
      overflow-y: auto;
    }
    .logo {
      height: 64px;
      display: flex;
      align-items: center;
      padding-left: 24px;
      color: #fff;
      font-size: 18px;
      font-weight: 600;
      background: #002140;
    }
    .menu-section {
      padding: 12px 0;
    }
    .menu-title {
      padding: 8px 24px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.45);
      text-transform: uppercase;
    }
    .menu-item {
      position: relative;
      padding: 12px 24px 12px 48px;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 14px;
    }
    .menu-item:hover {
      color: #fff;
      background: #1890ff;
    }
    .menu-item.active {
      color: #fff;
      background: #1890ff;
    }
    .menu-item.has-children::after {
      content: '›';
      position: absolute;
      right: 24px;
      top: 12px;
      font-size: 16px;
    }
    .submenu {
      background: #000c17;
    }
    .submenu .menu-item {
      padding-left: 64px;
      font-size: 13px;
    }
    .submenu .menu-item.active {
      background: #1890ff;
    }
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .header {
      height: 64px;
      background: #fff;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
    }
    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: rgba(0, 0, 0, 0.45);
    }
    .breadcrumb a {
      color: rgba(0, 0, 0, 0.45);
      text-decoration: none;
    }
    .breadcrumb a:hover {
      color: #1890ff;
    }
    .breadcrumb .current {
      color: rgba(0, 0, 0, 0.85);
      font-weight: 500;
    }
    .user-area {
      display: flex;
      align-items: center;
      gap: 16px;
      color: rgba(0, 0, 0, 0.65);
      font-size: 14px;
    }
    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #1890ff;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 500;
    }
    .content {
      flex: 1;
      padding: 24px;
      overflow: auto;
    }
    .page-header {
      background: #fff;
      padding: 16px 24px;
      border-radius: 2px;
      margin-bottom: 24px;
      border-bottom: 1px solid #f0f0f0;
    }
    .page-title {
      font-size: 20px;
      font-weight: 500;
      color: rgba(0, 0, 0, 0.85);
    }
    .card {
      background: #fff;
      border-radius: 2px;
      padding: 24px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
    }
    .card-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .card-title {
      font-size: 16px;
      font-weight: 500;
      color: rgba(0, 0, 0, 0.85);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 16px;
      border-radius: 2px;
      font-size: 14px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.3s;
      line-height: 1.5;
    }
    .btn-primary {
      background: #1890ff;
      color: #fff;
      border-color: #1890ff;
    }
    .btn-primary:hover {
      background: #40a9ff;
      border-color: #40a9ff;
    }
    .btn-default {
      background: #fff;
      color: rgba(0, 0, 0, 0.65);
      border-color: #d9d9d9;
    }
    .btn-default:hover {
      color: #1890ff;
      border-color: #1890ff;
    }
    .btn + .btn {
      margin-left: 8px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      padding: 16px;
      text-align: left;
      border-bottom: 1px solid #f0f0f0;
    }
    th {
      background: #fafafa;
      color: rgba(0, 0, 0, 0.85);
      font-weight: 500;
    }
    tr:hover td {
      background: #fafafa;
    }
    .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 2px;
      font-size: 12px;
      line-height: 18px;
      border: 1px solid;
    }
    .tag-normal { background: #f6ffed; color: #389e0d; border-color: #b7eb8f; }
    .tag-minor { background: #e6f7ff; color: #096dd9; border-color: #91d5ff; }
    .tag-major { background: #fff7e6; color: #d46b08; border-color: #ffd591; }
    .tag-urgent { background: #fff1f0; color: #cf1322; border-color: #ffa39e; }
    select {
      padding: 6px 12px;
      border: 1px solid #d9d9d9;
      border-radius: 2px;
      min-width: 220px;
      font-size: 14px;
      color: rgba(0, 0, 0, 0.65);
      background: #fff;
      cursor: pointer;
    }
    select:hover, select:focus {
      border-color: #40a9ff;
      outline: none;
    }
    .empty-option {
      color: rgba(0, 0, 0, 0.25);
    }
    .status-saved {
      color: #52c41a;
      font-size: 12px;
      margin-left: 8px;
    }
    .status-unsaved {
      color: #faad14;
      font-size: 12px;
      margin-left: 8px;
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="logo">智慧园区</div>
      <div class="menu-section">
        <div class="menu-title">安防管理</div>
        <div class="menu-item">视频巡更</div>
        <div class="menu-item">人员安全</div>
        <div class="menu-item">车辆安全</div>
        <div class="menu-item">安防设备</div>
        <div class="menu-item has-children active">安防告警</div>
        <div class="submenu">
          <div class="menu-item">实时告警</div>
          <div class="menu-item">告警档案</div>
          <div class="menu-item">安防告警处置</div>
          <div class="menu-item active">告警处置配置</div>
        </div>
        <div class="menu-item">设备地图</div>
        <div class="menu-item">防区地图</div>
        <div class="menu-item">电子巡更</div>
      </div>
      <div class="menu-section">
        <div class="menu-title">消防管理</div>
        <div class="menu-item">智慧消防</div>
      </div>
      <div class="menu-section">
        <div class="menu-title">人员管理</div>
        <div class="menu-item">园区人员</div>
      </div>
    </aside>

    <main class="main">
      <header class="header">
        <div class="breadcrumb">
          <a href="#">首页</a>
          <span>/</span>
          <a href="#">智慧安防</a>
          <span>/</span>
          <a href="#">安防告警</a>
          <span>/</span>
          <span class="current">告警处置配置</span>
        </div>
        <div class="user-area">
          <span>意见反馈</span>
          <span>下载中继插件</span>
          <span class="avatar">管</span>
          <span>admin</span>
        </div>
      </header>

      <div class="content">
        <div class="page-header">
          <div class="page-title">告警处置配置</div>
        </div>

        <div class="card">
          <div class="card-toolbar">
            <div class="card-title">告警规则配置</div>
            <div>
              <button class="btn btn-default" onclick="resetConfig()">重置</button>
              <button class="btn btn-primary" onclick="saveAll()">保存全部</button>
            </div>
          </div>

          <table id="configTable">
            <thead>
              <tr>
                <th style="width: 140px;">告警类型</th>
                <th style="width: 120px;">告警等级</th>
                <th>关联审批流</th>
              </tr>
            </thead>
            <tbody id="configBody">
              <!-- JS renders rows -->
            </tbody>
          </table>

        </div>
      </div>
    </main>
  </div>

  <script>
    // 初始配置数据
    const alarmTypes = [
      { key: 'security', name: '安防告警' },
      { key: 'fire', name: '消防告警' }
    ];

    const alarmLevels = [
      { key: 'normal', name: '普通', tagClass: 'tag-normal' },
      { key: 'minor', name: '次要', tagClass: 'tag-minor' },
      { key: 'major', name: '重要', tagClass: 'tag-major' },
      { key: 'urgent', name: '紧急', tagClass: 'tag-urgent' }
    ];

    const approvalFlows = [
      { id: '', name: '— 不关联审批流 —' },
      { id: 'flow_001', name: '安防告警标准审批流' },
      { id: 'flow_002', name: '消防告警快速处置流' },
      { id: 'flow_003', name: '紧急事件升级审批流' },
      { id: 'flow_004', name: '一般事件审批流' },
      { id: 'flow_005', name: '设备故障维修审批流' }
    ];

    let configData = [
      { type: 'security', level: 'normal', flowId: 'flow_004' },
      { type: 'security', level: 'minor', flowId: 'flow_004' },
      { type: 'security', level: 'major', flowId: 'flow_001' },
      { type: 'security', level: 'urgent', flowId: 'flow_003' },
      { type: 'fire', level: 'normal', flowId: 'flow_004' },
      { type: 'fire', level: 'minor', flowId: 'flow_002' },
      { type: 'fire', level: 'major', flowId: 'flow_002' },
      { type: 'fire', level: 'urgent', flowId: 'flow_003' }
    ];

    const initialData = JSON.stringify(configData);
    let changedRows = new Set();

    function getTypeName(key) {
      return alarmTypes.find(t => t.key === key)?.name || key;
    }

    function getLevel(key) {
      return alarmLevels.find(l => l.key === key);
    }

    function getFlowOptions(selectedId) {
      return approvalFlows.map(flow => {
        const selected = flow.id === selectedId ? 'selected' : '';
        const emptyClass = flow.id === '' ? 'empty-option' : '';
        return `<option value="${flow.id}" ${selected} class="${emptyClass}">${flow.name}</option>`;
      }).join('');
    }

    function renderTable() {
      const tbody = document.getElementById('configBody');
      tbody.innerHTML = configData.map((row, index) => {
        const level = getLevel(row.level);
        const changed = changedRows.has(index) ? '<span class="status-unsaved">（待保存）</span>' : '<span class="status-saved">（已保存）</span>';
        return `
          <tr data-index="${index}">
            <td>${getTypeName(row.type)}</td>
            <td><span class="tag ${level.tagClass}">${level.name}</span></td>
            <td>
              <select onchange="onFlowChange(${index}, this.value)">
                ${getFlowOptions(row.flowId)}
              </select>
              ${changed}
            </td>
          </tr>
        `;
      }).join('');
    }

    function onFlowChange(index, value) {
      configData[index].flowId = value;
      changedRows.add(index);
      renderTable();
    }

    function saveAll() {
      // 模拟保存全部
      changedRows.clear();
      renderTable();
      alert('全部配置已保存');
    }

    function resetConfig() {
      if (confirm('确定要重置为初始配置吗？未保存的修改将丢失。')) {
        configData = JSON.parse(initialData);
        changedRows.clear();
        renderTable();
      }
    }

    renderTable();
  </script>
</body>
</html>
