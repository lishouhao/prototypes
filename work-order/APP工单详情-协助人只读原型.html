<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>APP工单详情-协助人只读原型</title>
  <style>
    :root{--bg:#f3f5fb;--surface:#fff;--line:#eef1f7;--text:#2b2f36;--muted:#8a90a0;--blue:#3f6df5;--blue-soft:#edf4ff;--green:#1eb14d;--green-soft:#ecfae6;--shadow:0 10px 26px rgba(30,48,102,.08)}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:linear-gradient(180deg,#dfe7ff 0,#eef2fb 18%,#f5f7fc 100%)}.phone{width:390px;height:844px;margin:0 auto;position:relative;overflow:hidden;background:var(--bg)}.statusbar{height:30px;padding:8px 14px 0;display:flex;justify-content:space-between;font-size:12px;color:#111}.topbar{height:48px;display:flex;align-items:center;padding:0 14px;position:relative}.back{width:28px;font-size:28px;line-height:1;color:#2b3140}.title{flex:1;text-align:center;margin-right:28px;font-size:18px;font-weight:700;color:#242a34}.content{height:calc(100% - 78px);overflow:auto;padding:0 10px 12px}.card{background:var(--surface);border-radius:8px;margin-bottom:10px;box-shadow:0 1px 0 rgba(16,24,40,.02);overflow:hidden}.card-head{height:60px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.section-title{font-size:16px;font-weight:700;color:#3c65ea;position:relative;padding-bottom:4px}.section-title:after{content:"";position:absolute;left:0;bottom:-1px;width:34px;height:2px;background:var(--blue);border-radius:2px}.status-pill{height:32px;padding:0 14px 0 12px;border-radius:10px;background:#f3f7ff;color:#3564f0;display:inline-flex;align-items:center;gap:8px;font-weight:700;box-shadow:0 4px 10px rgba(64,105,245,.08)}.status-pill.green{background:var(--green-soft);color:var(--green)}.status-dot{width:10px;height:10px;border-radius:50%;background:currentColor;box-shadow:0 0 0 4px rgba(63,109,245,.12)}.summary-row{padding:12px 16px 14px;border-bottom:1px solid #f4f6fb;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.summary-label{color:#2b2f36;font-size:16px}.level-tag{padding:2px 8px;border-radius:12px;background:#edf3ff;color:#3564f0;font-size:12px;font-weight:700}.summary-value{color:#2b2f36;font-size:16px}.list{padding:0 16px 8px}.row{min-height:44px;display:grid;grid-template-columns:92px 1fr;align-items:center;gap:10px;border-bottom:1px solid #f4f6fb;padding:4px 0}.row:last-child{border-bottom:0}.label{color:#2c3240;font-size:14px;white-space:nowrap}.value{color:#2b2f36;font-size:14px;word-break:break-word}.value.muted{color:var(--muted)}.chip-list{display:flex;flex-wrap:wrap;gap:6px}.chip{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 8px;border-radius:13px;background:#eef3ff;color:#3656d9;font-size:13px;font-weight:700}.chip.more{background:#f6f8ff;color:#3f6df5;border:1px solid #d7e1ff;cursor:pointer}.chip.hidden{display:none}.bottom-bar.view-only{justify-content:center}.bottom-bar.view-only .btn{max-width:220px;flex:1}.attach-box{padding:8px 16px 16px;display:flex;gap:10px;align-items:flex-start}.thumb{width:72px;height:92px;border-radius:4px;background:linear-gradient(180deg,#a9bbd8 0,#dfe7f4 45%,#8ca3c5 100%);box-shadow:var(--shadow)}.bottom-bar{position:absolute;left:0;right:0;bottom:0;height:72px;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 14px;box-shadow:0 -6px 18px rgba(34,47,84,.06)}.more-link{color:#3760f0;font-weight:700;font-size:14px;min-width:42px}.btn{height:42px;flex:1;border-radius:8px;border:1px solid #dce3f3;background:#fff;color:#3c4454;font-weight:700;font-size:15px}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}</style>
</head>
<body>
  <div class="phone">
    <div class="statusbar"><span>10:39</span><span>●●● 5G</span></div>
    <div class="topbar"><div class="back">‹</div><div class="title">工单信息</div></div>
    <div class="content">
      <div class="card">
        <div class="card-head"><div class="section-title">申请信息</div><div class="status-pill green"><span class="status-dot"></span><span>已办结</span></div></div>
        <div class="summary-row"><div class="summary-label">工单标题</div><div class="level-tag">一般</div><div class="summary-value">T 保修流程正确072302</div></div>
        <div class="list">
          <div class="row"><div class="label">申请编号</div><div class="value">SBBX20260723190901000777000c237</div></div>
          <div class="row"><div class="label">工单编号</div><div class="value">SBBX_202607230545</div></div>
          <div class="row"><div class="label">发生时间</div><div class="value">2026-07-23 19:09:02</div></div>
          <div class="row"><div class="label">工单类型</div><div class="value">设备报修</div></div>
          <div class="row"><div class="label">工单来源</div><div class="value">工单管理</div></div>
          <div class="row"><div class="label">附件信息</div><div class="value muted">-</div></div>
          <div class="row"><div class="label">申请人</div><div class="value">bmct</div></div>
          <div class="row"><div class="label">申请人号码</div><div class="value">15601691300</div></div>
          <div class="row"><div class="label">指派人</div><div class="value">bmct</div></div>
          <div class="row"><div class="label">协助人</div><div class="value"><div class="chip-list" id="assistList"><span class="chip">张晨曦</span><span class="chip">李工</span><span class="chip">王工</span><span class="chip hidden">赵工</span><span class="chip hidden">陈工</span><span class="chip more" id="assistToggle">等2人</span></div></div></div>
          <div class="row"><div class="label">专业类别</div><div class="value muted">-</div></div>
          <div class="row"><div class="label">专业描述</div><div class="value muted">-</div></div>
        </div>
      </div>
      <div class="card">
        <div class="card-head"><div class="section-title">设备信息</div></div>
        <div class="list">
          <div class="row"><div class="label">发生位置</div><div class="value">苏州实验室-综合楼-户外</div></div>
          <div class="row"><div class="label">设备类型</div><div class="value muted">-</div></div>
          <div class="row"><div class="label">关联设备</div><div class="value muted">-</div></div>
        </div>
      </div>
    </div>
    <div class="bottom-bar view-only"><button class="btn primary">返回列表</button></div>
  </div>
  <script>
    const assistToggle = document.getElementById('assistToggle');
    if (assistToggle) {
      assistToggle.addEventListener('click', () => {
        const hiddenItems = document.querySelectorAll('#assistList .hidden');
        const expanded = assistToggle.dataset.expanded === 'true';
        hiddenItems.forEach(item => item.style.display = expanded ? 'none' : 'inline-flex');
        assistToggle.textContent = expanded ? '等2人' : '收起';
        assistToggle.dataset.expanded = expanded ? 'false' : 'true';
      });
    }
  </script></body>
</html>
