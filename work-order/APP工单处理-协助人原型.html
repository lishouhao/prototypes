<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>APP工单处理-协助人原型</title>
  <style>
    :root{
      --bg:#f3f5fb;
      --surface:#ffffff;
      --line:#edf0f6;
      --text:#2b2f36;
      --muted:#8a90a0;
      --primary:#3f6df5;
      --primary-soft:#e8efff;
      --blue:#2d5ef7;
      --shadow:0 10px 26px rgba(30,48,102,.08);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
      color:var(--text);
      background:linear-gradient(180deg,#dfe7ff 0,#eef2fb 18%,#f5f7fc 100%);
    }
    .phone{
      width:390px;
      height:844px;
      margin:0 auto;
      position:relative;
      overflow:hidden;
      background:var(--bg);
    }
    .statusbar{
      height:30px;
      padding:8px 14px 0;
      display:flex;
      justify-content:space-between;
      font-size:12px;
      color:#111;
    }
    .topbar{
      height:48px;
      display:flex;
      align-items:center;
      padding:0 14px;
      position:relative;
    }
    .back{
      width:28px;
      font-size:28px;
      line-height:1;
      color:#2b3140;
    }
    .title{
      flex:1;
      text-align:center;
      margin-right:28px;
      font-size:18px;
      font-weight:700;
      color:#242a34;
    }
    .content{
      height:calc(100% - 78px - 72px);
      overflow:auto;
      padding:0 10px 12px;
    }
    .card{
      background:var(--surface);
      border-radius:8px;
      margin-bottom:10px;
      box-shadow:0 1px 0 rgba(16,24,40,.02);
      overflow:hidden;
    }
    .card-head{
      height:60px;
      padding:0 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      border-bottom:1px solid var(--line);
    }
    .section-title{
      font-size:16px;
      font-weight:700;
      color:#3c65ea;
      position:relative;
      padding-bottom:4px;
    }
    .section-title:after{
      content:"";
      position:absolute;
      left:0;
      bottom:-1px;
      width:34px;
      height:2px;
      background:var(--blue);
      border-radius:2px;
    }
    .status-pill{
      height:32px;
      padding:0 14px 0 12px;
      border-radius:10px;
      background:#f3f7ff;
      color:#3564f0;
      display:inline-flex;
      align-items:center;
      gap:8px;
      font-weight:700;
      box-shadow:0 4px 10px rgba(64,105,245,.08);
    }
    .status-dot{
      width:10px;height:10px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px rgba(63,109,245,.12)
    }
    .summary-row{
      padding:12px 16px 14px;
      border-bottom:1px solid #f4f6fb;
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }
    .summary-label{color:#2b2f36;font-size:16px}
    .level-tag{
      padding:2px 8px;
      border-radius:12px;
      background:#edf3ff;
      color:#3564f0;
      font-size:12px;
      font-weight:700;
    }
    .summary-value{color:#2b2f36;font-size:16px}
    .list{padding:0 16px 8px}
    .row{
      min-height:44px;
      display:grid;
      grid-template-columns:92px 1fr auto;
      align-items:center;
      gap:10px;
      border-bottom:1px solid #f4f6fb;
      padding:4px 0;
    }
    .row:last-child{border-bottom:0}
    .label{color:#2c3240;font-size:14px;white-space:nowrap}
    .value{color:#2b2f36;font-size:14px;word-break:break-word}
    .value.muted{color:var(--muted)}
    .edit-btn{
      border:0;
      background:transparent;
      color:var(--primary);
      font-size:13px;
      font-weight:700;
      padding:0 0 0 8px;
    }
    .chip-list{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-start}
    .chip{
      display:inline-flex;
      align-items:center;
      gap:4px;
      height:26px;
      padding:0 8px;
      border-radius:13px;
      background:#eef3ff;
      color:#3656d9;
      font-size:13px;
      font-weight:700;
    }
    .chip button{border:0;background:transparent;color:#7b89bd;font-size:14px;padding:0;line-height:1}
    .hint{
      padding:0 16px 12px;
      font-size:12px;
      color:#96a0b3;
    }
    .attach-box{
      padding:8px 16px 16px;
      display:flex;
      gap:10px;
      align-items:flex-start;
    }
    .thumb{
      width:72px;
      height:92px;
      border-radius:4px;
      background:linear-gradient(180deg,#a9bbd8 0,#dfe7f4 45%,#8ca3c5 100%);
      box-shadow:var(--shadow);
    }
    .bottom-bar{
      position:absolute;
      left:0;right:0;bottom:0;
      height:72px;
      background:#fff;
      border-top:1px solid var(--line);
      display:flex;
      align-items:center;
      gap:10px;
      padding:0 14px;
      box-shadow:0 -6px 18px rgba(34,47,84,.06);
    }
    .more-link{
      color:#3760f0;
      font-weight:700;
      font-size:14px;
      min-width:42px;
    }
    .btn{
      height:42px;
      flex:1;
      border-radius:8px;
      border:1px solid #dce3f3;
      background:#fff;
      color:#3c4454;
      font-weight:700;
      font-size:15px;
    }
    .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
    .modal-mask{
      position:absolute;
      inset:0;
      background:rgba(15,22,36,.28);
      display:none;
      align-items:flex-end;
      justify-content:center;
    }
    .modal-mask.show{display:flex}
    .sheet{
      width:100%;
      background:#fff;
      border-radius:16px 16px 0 0;
      box-shadow:0 -12px 36px rgba(16,24,40,.14);
      max-height:78%;
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }
    .sheet-head{
      height:52px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 16px;
      border-bottom:1px solid var(--line);
      font-size:16px;
      font-weight:700;
    }
    .sheet-body{padding:12px 16px 16px;overflow:auto}
    .search{
      width:100%;
      height:38px;
      border:1px solid #dce3f2;
      border-radius:19px;
      padding:0 14px;
      outline:none;
      background:#fbfcff;
    }
    .dept-list{margin-top:12px;display:flex;flex-direction:column;gap:8px}
    .dept-item{
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px 12px;
      border:1px solid #edf1f7;
      border-radius:10px;
      background:#fff;
    }
    .dept-item input{width:16px;height:16px;margin:0}
    .dept-main{font-weight:700}
    .dept-sub{color:var(--muted);font-size:12px;margin-left:auto}
    .sheet-footer{
      padding:12px 16px 16px;
      display:flex;
      gap:10px;
      border-top:1px solid var(--line);
    }
    .sheet-footer .btn{flex:1}
  </style>
</head>
<body>
  <div class="phone">
    <div class="statusbar"><span>10:39</span><span>●●● 5G</span></div>
    <div class="topbar">
      <div class="back">‹</div>
      <div class="title">工单信息</div>
    </div>

    <div class="content">
      <div class="card">
        <div class="card-head">
          <div class="section-title">申请信息</div>
          <div class="status-pill"><span class="status-dot"></span><span>处理中</span></div>
        </div>
        <div class="summary-row">
          <div class="summary-label">工单标题</div>
          <div class="level-tag">一般</div>
          <div class="summary-value">测试</div>
        </div>
        <div class="list">
          <div class="row"><div class="label">申请信息</div><div class="value muted">-</div><div></div></div>
          <div class="row"><div class="label">工单编号</div><div class="value">SBBX_202607290562</div><div></div></div>
          <div class="row"><div class="label">发生时间</div><div class="value">2026-07-29 00:00:00</div><div></div></div>
          <div class="row"><div class="label">工单类型</div><div class="value">设备报修</div><div></div></div>
          <div class="row"><div class="label">工单来源</div><div class="value">工单管理</div><div></div></div>
          <div class="row"><div class="label">附件信息</div><div class="value muted">-</div><div></div></div>
          <div class="row"><div class="label">申请人</div><div class="value muted">-</div><div></div></div>
          <div class="row"><div class="label">申请人号码</div><div class="value muted">-</div><div></div></div>
          <div class="row"><div class="label">指派人</div><div class="value muted">-</div><div></div></div>
          <div class="row"><div class="label">协助人</div><div class="value">
            <div class="chip-list" id="assistChips">
              <span class="chip">-</span>
            </div>
          </div><button class="edit-btn" id="openAssist">维护</button></div>
          <div class="row"><div class="label">专业类别</div><div class="value muted">-</div><div></div></div>
          <div class="row"><div class="label">专业描述</div><div class="value muted">-</div><div></div></div>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <div class="section-title">设备信息</div>
        </div>
        <div class="list">
          <div class="row"><div class="label">发生位置</div><div class="value">苏州实验室/泵园/5栋/3F</div><div></div></div>
          <div class="row"><div class="label">设备类型</div><div class="value">西门子消防</div><div></div></div>
          <div class="row"><div class="label">关联设备</div><div class="value">地库防火分区一烟感1-1-41</div><div></div></div>
          <div class="row"><div class="label">问题描述</div><div class="value muted">-</div><div></div></div>
          <div class="attach-box"><div class="thumb"></div></div>
        </div>
      </div>
    </div>

    <div class="bottom-bar">
      <div class="more-link">更多</div>
      <button class="btn">取消</button>
      <button class="btn primary">处理</button>
    </div>

    <div class="modal-mask" id="assistSheet">
      <div class="sheet">
        <div class="sheet-head">
          <span>维护协助人</span>
          <span style="color:#96a0b3;font-size:22px;line-height:1;cursor:pointer" id="closeAssist">×</span>
        </div>
        <div class="sheet-body">
          <input class="search" placeholder="请输入姓名/部门搜索" />
          <div class="dept-list">
            <label class="dept-item"><input type="checkbox" checked /><span class="dept-main">张晨曦</span><span class="dept-sub">工程运维部</span></label>
            <label class="dept-item"><input type="checkbox" /><span class="dept-main">陈晓</span><span class="dept-sub">工程运维部</span></label>
            <label class="dept-item"><input type="checkbox" checked /><span class="dept-main">李工</span><span class="dept-sub">综合管理部</span></label>
            <label class="dept-item"><input type="checkbox" /><span class="dept-main">王宁</span><span class="dept-sub">物业服务部</span></label>
          </div>
        </div>
        <div class="sheet-footer">
          <button class="btn" id="cancelAssist">取消</button><button class="btn" id="clearAssist">清空</button>
          <button class="btn primary" id="saveAssist">确定</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const sheet = document.getElementById('assistSheet');
    document.getElementById('openAssist').onclick = () => sheet.classList.add('show');
    document.getElementById('closeAssist').onclick = () => sheet.classList.remove('show');
    document.getElementById('cancelAssist').onclick = () => sheet.classList.remove('show');
    document.getElementById('clearAssist').onclick = () => {
      sheet.querySelectorAll('.dept-item input').forEach(input => input.checked = false);
    };
    document.getElementById('saveAssist').onclick = () => {
      sheet.classList.remove('show');
      const chips = document.getElementById('assistChips');
      const names = Array.from(sheet.querySelectorAll('.dept-item input:checked')).map(input => input.parentElement.querySelector('.dept-main').textContent.trim());
      chips.innerHTML = names.length ? names.map(name => `<span class="chip">${name} <button>×</button></span>`).join('') : '<span class="value muted">--</span>';
    };
  </script>
</body>
</html>
