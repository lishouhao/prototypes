<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>苏实 e站问卷调查原型</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="page-wrap">
    <section class="phone">
      <div class="status-bar">
        <span>10:42</span>
        <span>5G  100%</span>
      </div>

      <header class="nav">
        <button class="icon-btn" data-back>‹</button>
        <h1 id="pageTitle">苏实 e站</h1>
        <span></span>
      </header>

      <div class="screen active" id="portalScreen">
        <section class="campus-cover"></section>

        <section class="card overview-card">
          <h2>数据总览</h2>
          <div class="overview-grid">
            <div><strong>1323</strong><span>剩余车位</span></div>
            <div><strong>1</strong><span>待办工单</span></div>
          </div>
        </section>

        <section class="card service-card">
          <h2>物业工作台</h2>
          <div class="service-grid">
            <button class="service-item" data-action="placeholder"><span class="service-icon purple clipboard"></span><b>我的工单</b></button>
            <button class="service-item" data-action="placeholder"><span class="service-icon orange alert"></span><b>告警处置</b></button>
            <button class="service-item" data-action="placeholder"><span class="service-icon purple calendar"></span><b>个人排班</b></button>
            <button class="service-item" data-action="placeholder"><span class="service-icon blue siren"></span><b>能耗预警</b></button>
          </div>
        </section>

        <section class="card service-card">
          <h2>员工服务</h2>
          <div class="service-grid employee-grid">
            <button class="service-item" data-action="placeholder"><span class="service-icon orange bowl"></span><b>就餐管理</b></button>
            <button class="service-item" data-action="placeholder"><span class="service-icon green gym"></span><b>智慧场馆</b></button>
            <button class="service-item" data-action="placeholder"><span class="service-icon red card"></span><b>一卡通</b></button>
            <button class="service-item" data-action="placeholder"><span class="service-icon blue idcard"></span><b>访客审批</b></button>
            <button class="service-item" data-action="placeholder"><span class="service-icon purple fork"></span><b>用餐反馈</b></button>
            <button class="service-item" data-action="placeholder"><span class="service-icon gray service"></span><b>一键服务</b></button>
            <button class="service-item" data-action="placeholder"><span class="service-icon purple bed"></span><b>公寓管理</b></button>
            <button class="service-item" data-action="placeholder"><span class="service-icon orange car"></span><b>车位申请</b></button>
            <button class="service-item" data-action="placeholder"><span class="service-icon green menu"></span><b>菜品查询</b></button>
            <button class="service-item" data-action="placeholder"><span class="service-icon green meeting"></span><b>会议预约</b></button>
            <button class="service-item" data-page="home"><span class="service-icon blue survey"></span><b>问卷调查</b></button>
          </div>
        </section>
      </div>
      <div class="screen" id="homeScreen">
        <section class="card">
          <div class="section-head">
            <h3>待填写问卷</h3>
          </div>
          <button class="task-row" data-task="property" data-object="明德物业" data-status="todo">
            <div class="task-info">
              <strong>2026年7月物业服务调查问卷</strong>
              <p>2026-07-20 至 2026-07-31</p>
            </div>
            <span class="tag running">进行中</span>
          </button>
          <button class="task-row" data-task="property" data-object="启新物业" data-status="todo">
            <div class="task-info">
              <strong>2026年7月物业服务调查问卷</strong>
              <p>2026-07-20 至 2026-07-31</p>
            </div>
            <span class="tag running">进行中</span>
          </button>
          <button class="task-row" data-task="canteen" data-object="一号餐厅" data-status="todo">
            <div class="task-info">
              <strong>2026年7月餐厅服务调查问卷</strong>
              <p>2026-07-20 至 2026-07-31</p>
            </div>
            <span class="tag running">进行中</span>
          </button>
          <button class="task-row" data-task="canteen" data-object="二号餐厅" data-status="todo">
            <div class="task-info">
              <strong>2026年7月餐厅服务调查问卷</strong>
              <p>2026-07-20 至 2026-07-31</p>
            </div>
            <span class="tag running">进行中</span>
          </button>
        </section>
        <section class="card status-demo-card">
          <div class="section-head">
            <h3>状态示例</h3>
            <span>研发验收口径</span>
          </div>
          <button class="task-row" data-state="submitted">
            <div class="task-mark muted-mark">已</div>
            <div class="task-info">
              <strong>2026年7月餐厅服务调查问卷</strong>
              <p>已于 2026-07-20 10:08 提交</p>
              <em>提交后不可修改，不再进入填写页</em>
            </div>
            <span class="tag done">已提交</span>
          </button>
          <button class="task-row" data-state="notStarted">
            <div class="task-mark muted-mark">待</div>
            <div class="task-info">
              <strong>2026年8月服务调查问卷</strong>
              <p>2026-08-10 09:00 开始</p>
              <em>未到开始时间，暂不可提交</em>
            </div>
            <span class="tag upcoming">未开始</span>
          </button>
          <button class="task-row" data-state="expired">
            <div class="task-mark muted-mark">止</div>
            <div class="task-info">
              <strong>2026年6月服务调查问卷</strong>
              <p>已于 2026-06-15 18:00 结束</p>
              <em>超过结束时间，不允许提交</em>
            </div>
            <span class="tag expired">已结束</span>
          </button>
          <button class="task-row" data-state="empty">
            <div class="task-mark muted-mark">空</div>
            <div class="task-info">
              <strong>暂无可填写问卷</strong>
              <p>当前账号无符合范围且进行中的问卷</p>
              <em>展示空状态，不展示提交按钮</em>
            </div>
            <span class="tag done">空</span>
          </button>
        </section>        <section class="card empty-state" hidden>暂无待填写问卷</section>
      </div>
      <div class="screen" id="formScreen">
        <section class="card sub-card">
          <h2 id="formObject">2026年7月餐厅服务调查问卷</h2>
          <p id="formInstruction">请按每个维度的分值范围完成评分。</p>
        </section>
        <section class="card" id="scoreList"></section>
        <p class="form-error" id="formError"></p>
      </div>


      <div class="screen" id="stateScreen">
        <section class="state-card">
          <div class="state-icon" id="stateIcon">!</div>
          <h2 id="stateTitle">暂不可填写</h2>
          <p id="stateDesc">当前问卷暂不支持填写。</p>
          <button class="btn primary" data-page="home">返回问卷列表</button>
        </section>
      </div>
      <div class="screen" id="successScreen">
        <section class="success-card">
          <div class="success-icon">✓</div>
          <h2>提交成功</h2>
          <div class="success-info">
            <span>评价对象</span><strong id="successObject">一号餐厅</strong>
            <span>提交时间</span><strong>2026-07-22 10:42</strong>
            <span>提交规则</span><strong>提交后不可修改</strong>
          </div>
          <button class="btn primary" data-page="home">返回问卷列表</button>
        </section>
      </div>


      <footer class="bottom-bar" id="bottomBar">
        <button class="btn secondary" data-back>返回</button>
        <button class="btn primary" id="submitBtn">提交问卷</button>
      </footer>
    </section>
  </main>

  <div class="toast" id="toast"></div>
  <script src="./script.js"></script>
</body>
</html>
