:root{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif;color:#36373b;background:#eef2f7}
*{box-sizing:border-box}
.account a{color:var(--primary);text-decoration:none}
.account{position:absolute;right:16px;top:0;height:48px;display:flex;align-items:center;gap:14px;font-size:14px}
.admin-shell{width:100vw;height:100vh;min-height:768px;display:flex;overflow:hidden;background:#f1f4f8}
.attachment-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attachment-item{height:40px;max-width:260px;border:1px solid #dfe4ed;border-radius:4px;background:#f7f7fa;color:#4165ec;padding:0 14px;display:inline-flex;align-items:center;gap:8px;font-size:14px}
.attachment-list{display:flex;flex-wrap:wrap;gap:12px}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#ffc083,#5bb3ff);color:#fff;font-weight:800}
.check{width:42px;text-align:center}
.content{flex:1;padding:20px 20px 56px;overflow:auto}
.copyright{position:absolute;left:0;right:0;bottom:16px;text-align:center;color:#a6adb8;font-size:13px}
.crumb strong{color:#1f232b;font-weight:800}
.crumb{height:48px;display:flex;align-items:center;gap:10px;padding-left:12px;font-size:14px}
.detail-card{padding:20px}
.detail-layout{display:grid;grid-template-columns:minmax(760px,1fr) 272px;gap:16px;min-height:calc(100vh - 116px)}
.detail-section h2,.log-card h2{margin:0 0 22px;display:flex;align-items:center;gap:10px;font-size:15px;font-weight:500;color:#36373b}
.detail-section{border:1px solid #dfe4ed;border-radius:4px;padding:22px 20px 26px;margin-bottom:22px}
.export-green{color:#55b84a;border-color:#bde5b8;background:#f5fff4}
.face{width:36px;height:36px;display:grid;place-items:center;border-radius:2px;background:#d8e2ed;color:#536172;font-size:10px}
.filter-card h2{height:58px;display:flex;align-items:center;margin:0;padding:0 18px;border-bottom:1px solid #e6ebf2;color:#10141c;font-size:15px;font-weight:800}
.filter-card,.table-card,.detail-card,.log-card{background:#fff;border:1px solid #e5e9f0;border-radius:6px;box-shadow:0 1px 5px #14243c0a;overflow-x:auto;min-width:0}
.filter-card{margin-bottom:12px}
.filters label{display:flex;align-items:center;gap:12px;color:#606775;font-size:14px}
.filters{min-height:68px;display:flex;align-items:center;gap:20px;padding:18px}
.ghost-tab{width:32px;padding:0;justify-content:center;color:#a9b0bc}
.info-grid p{margin:0;color:#8f9098;font-size:14px}
.info-grid strong{color:#20242c;font-size:14px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;column-gap:70px;row-gap:20px;padding-left:20px}
.input{width:182px;height:36px;border:1px solid #d8dfe8;border-radius:4px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 12px;color:#a2a9b5}
.log-card{padding:22px}
.pagination .page-input{min-width:52px}
.pagination a.active{color:var(--primary);font-weight:800}
.pagination button{height:32px;min-width:82px;border:1px solid #d8dfe8;background:#fff;border-radius:4px;color:#606775;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.pagination{height:58px;display:flex;align-items:center;justify-content:flex-end;gap:14px;color:#606775;border-top:1px solid #e9edf3}
.people-section,.attachment-section{border:0;border-top:1px solid #e6ebf2;border-radius:0;padding:22px 0 0}
.people-table td{height:58px;padding-left:18px}
.people-table th{height:48px;background:#f5f5f6;padding-left:18px}
.primary-btn,.secondary-btn,.tool-btn{height:36px;border-radius:4px;border:0;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;font-size:14px}
.primary-btn{margin-left:auto;background:var(--primary);color:#fff}
.row-actions button{border:0;background:transparent;color:var(--primary);padding:0 6px 0 0}
.row-actions{color:var(--primary)}
.secondary-btn,.tool-btn{border:1px solid #dfe4ed;background:#f7f7fa;color:#526bff}
.secondary-btn{color:#666d78}
.side-item.expanded{color:#fff;background:#08243c}
.side-item{height:54px;padding:0 20px;display:grid;grid-template-columns:20px 1fr 14px;align-items:center;gap:8px;font-size:15px;color:#bfd3e7}
.sidebar h1{margin:0;height:48px;display:flex;align-items:center;padding-left:18px;color:#fff;font-size:17px;font-weight:800}
.sidebar nav{padding-top:4px}
.sidebar{width:190px;flex:0 0 190px;background:#061d31;color:#c2d5e7;overflow:hidden}
.status-tag{display:inline-block;padding:2px 10px;border-radius:10px;font-size:12px;line-height:18px;font-weight:500;white-space:nowrap}
.status-tag.审批中{color:#f18f01;background:rgba(241,143,1,.12)}
.status-tag.审批通过{color:#20a35b;background:rgba(32,163,91,.12)}
.status-tag.审批不通过{color:#e34d59;background:rgba(227,77,89,.12)}
.status-tag.已取消{color:#8a94a6;background:rgba(138,148,166,.14)}
.sub-item.active{color:#fff;background:#173b5a;border-left:3px solid var(--primary);padding-left:35px}
.sub-item{width:100%;height:48px;padding-left:38px;border:0;background:#112f49;color:#c8dcf0;text-align:left;font-size:14px}
.tab,.ghost-tab{height:28px;border:1px solid #dfe4ed;background:#fff;color:#36373b;padding:0 18px;margin-right:4px;border-radius:3px 3px 0 0;display:inline-flex;align-items:center;gap:8px;font-size:13px}
.tab-tools svg{width:32px;height:32px;padding:8px;border-left:1px solid #dfe4ed}
.tab-tools{margin-left:auto;height:32px;display:flex;align-items:center;color:#a9b0bc}
.tab.active{border-color:var(--primary);background:var(--primary);color:#fff}
.table-card{padding:18px}
.tabsbar{height:32px;border-top:1px solid #eef1f5;display:flex;align-items:center;padding-left:8px}
.timeline i{width:12px;height:12px;margin-top:4px;border-radius:50%;background:#ff9017}
.timeline span,.timeline time{grid-column:2}
.timeline strong{color:#36373b;font-weight:500}
.timeline{display:grid;grid-template-columns:16px 1fr;column-gap:12px;row-gap:8px;color:#8f9098;font-size:14px}
.toolbar{display:flex;gap:12px;margin-bottom:14px}
.topbar{height:80px;flex:0 0 80px;background:#fff;border-bottom:1px solid #dfe4ed;position:relative}

.workspace{min-width:0;flex:1;position:relative;display:flex;flex-direction:column}
body{-webkit-font-smoothing:antialiased}
button,input{font:inherit}
button{cursor:pointer}
html,body,#root{margin:0;min-width:1280px;min-height:100vh}
input[type=checkbox]{width:14px;height:14px;accent-color:var(--primary)}
td{height:42px;border-bottom:1px solid #e9edf3;color:#646b76;padding:0 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
th.actions{width:132px}
th:nth-child(2),td:nth-child(2){width:52px}
th:nth-child(3),td:nth-child(3),th:nth-child(6),td:nth-child(6),th:nth-child(7),td:nth-child(7),th:nth-child(8),td:nth-child(8),th:nth-child(12),td:nth-child(12){width:78px}
th:nth-child(9),td:nth-child(9),th:nth-child(10),td:nth-child(10),th:nth-child(11),td:nth-child(11){width:104px}
th{height:44px;background:#f2f4f7;color:#20242c;font-weight:800;text-align:left;padding:0 10px}

.col-seq{text-align:center;color:#8a94a6;font-variant-numeric:tabular-nums}
</style>
