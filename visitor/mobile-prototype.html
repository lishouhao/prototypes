.overlay{position:absolute;inset:0;background:rgba(20,34,56,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.imp-overlay{align-items:center;padding:18px}
.imp-modal{position:relative;width:100%;max-height:92%;overflow:auto;background:var(--surface);border-radius:var(--r-lg);padding:22px 18px 18px;box-shadow:0 12px 40px #1e283c33}
.imp-title{margin:0 0 12px;font-size:18px;font-weight:800}
.imp-divider{height:1px;background:var(--border-soft);margin:14px 0}
.imp-tip{margin:0 0 12px;color:var(--muted);font-size:13px;line-height:1.6}
.req{color:var(--danger);font-weight:700}
.imp-file{display:flex;align-items:center;gap:10px;padding:14px;border:1.5px dashed var(--border-dash);border-radius:var(--r-md);color:var(--brand);font-size:14px;margin-bottom:14px;cursor:pointer}
.imp-file input{display:none}
.imp-summary{display:flex;gap:10px;margin-bottom:12px}
.imp-summary span{flex:1;text-align:center;padding:9px;border-radius:var(--r-sm);font-weight:700;font-size:14px}
.s-ok{background:var(--success-bg);color:var(--success)}
.s-fail{background:var(--danger-bg);color:var(--danger)}
.imp-rows{display:grid;gap:8px;margin-bottom:12px;max-height:42vh;overflow:auto}
.imp-row{border-radius:var(--r-md);padding:10px 12px;background:var(--surface-soft)}
.imp-row.ok{display:flex;align-items:center;gap:8px;background:var(--success-bg)}
.imp-row.ok small{color:var(--muted-2);margin-left:auto;font-size:12px}
.imp-row.fail{border:1px solid var(--danger-border);background:var(--danger-bg)}
.ok-tag{display:inline-flex;align-items:center;gap:3px;color:var(--success);font-weight:700;font-size:13px}
.err-tag{display:inline-flex;align-items:center;gap:3px;color:var(--danger);font-weight:600;font-size:12px;margin-left:auto}
.imp-row-head{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.imp-actions{display:grid;gap:9px;margin-bottom:8px}
.imp-actions .primary{width:100%}
.import-btn{color:var(--brand);border:1px dashed var(--brand-line);margin-top:10px}
.import-btn svg{stroke:var(--brand)}
.ghost{width:100%;padding:11px;border:1px solid var(--border-2);background:var(--surface);color:var(--muted);border-radius:var(--r-md);font-size:14px;font-weight:600}
button.primary{width:100%;padding:13px;border:0;border-radius:var(--r-md);background:var(--brand);color:var(--surface);font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
button.primary:disabled{background:var(--brand-disabled);color:var(--surface);cursor:not-allowed}
.mode-switch{display:flex;gap:8px;margin:14px 0 4px}
.mode-opt{flex:1;padding:11px;border:1px solid var(--border-2);border-radius:var(--r-md);background:var(--surface);color:var(--muted);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.mode-opt.active{border-color:var(--brand);background:var(--brand-50);color:var(--brand)}
.batch-hint{color:var(--muted);font-size:13px;line-height:1.6;margin:6px 0 10px}
.imp-row .del{margin-left:auto;color:var(--danger);font-size:12px;background:none;border:0;cursor:pointer;padding:0}
.bottom-bar{display:grid;gap:8px}
.draft-bar{display:flex;align-items:center;gap:8px;background:var(--warn-bg);border:1px solid var(--warn-border);border-radius:var(--r-md);padding:10px 12px;margin:0 0 16px;font-size:13px;color:var(--warn-text)}
.draft-bar b{font-size:13px}
.draft-actions{display:flex;gap:6px;margin-left:auto}
.draft-actions button{border:0;border-radius:var(--r-sm);padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer}
.draft-actions .resume{background:var(--brand);color:var(--surface)}
.draft-actions .discard{background:var(--surface);color:var(--muted);border:1px solid var(--border-2)}

</style>

/* ============ 草稿自动保存（移动端防丢） ============ */
const DRAFT_KEY = 'waiwai-apply-draft-v1';
function saveDraft(){
  try{
    const d = {
      _id: _id,
      type: state.type,
      singlePersons: state.singlePersons,
      batchPersons: state.batchPersons,
      personMode: state.personMode,
      hasContract: state.hasContract,
      noContractReason: state.noContractReason,
      hostCode: state.hostCode,
      hostName: state.hostName,
      hostDept: state.hostDept,
      unit: state.unit,
      reason: state.reason,
      startTime: state.startTime,
      endTime: state.endTime,
      attachment: state.attachment,
      protocolFile: state.protocolFile,
      agreementOk: state.agreementOk,
      savedAt: Date.now()
    };
    localStorage.setItem(DRAFT_KEY, JSON.stringify(d));
  }catch(e){}
}
function clearDraft(){
  try{ localStorage.removeItem(DRAFT_KEY); }catch(e){}
}
function hasDraft(){
  try{ return !!localStorage.getItem(DRAFT_KEY); }catch(e){ return false; }
}
function loadDraft(){
  try{
    const raw = localStorage.getItem(DRAFT_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function resumeDraft(){
  const d = loadDraft();
  if(!d){ render(); return; }
  state.type = d.type || 'visitor';
  state.singlePersons = (d.singlePersons && d.singlePersons.length) ? d.singlePersons : [newPerson()];
  state.batchPersons = d.batchPersons || [];
  state.personMode = d.personMode || 'single';
  state.hasContract = d.hasContract || '是';
  state.noContractReason = d.noContractReason || '';
  state.hostCode = d.hostCode || '';
  state.hostName = d.hostName || '';
  state.hostDept = d.hostDept || '';
  state.unit = d.unit || '';
  state.reason = d.reason || '';
  state.startTime = d.startTime || '';
  state.endTime = d.endTime || '';
  state.attachment = !!d.attachment;
  state.protocolFile = !!d.protocolFile;
  state.agreementOk = !!d.agreementOk;
  if(d._id) _id = d._id;
  state.view = 'form';
  render();
}
function discardDraft(){ clearDraft(); resetForm(); render(); }
function draftBar(){
  if(!hasDraft()) return '';
  const d = loadDraft();

}

/* ============ 渲染入口 ============ */
function render(){
  // 渲染前记录表单视图当前滚动位置（DOM 重建后浏览器会丢失）
  const fpOld = document.querySelector('.form-page');
  const savedTop = fpOld ? fpOld.scrollTop : 0;
  const root = document.getElementById('root');
  let html = '';
  if(state.view==='choose') html = renderChoose();
  else if(state.view==='form') html = renderForm();
  else if(state.view==='success') html = renderSuccess();
  root.innerHTML = html + (state.toast?'<div class="toast">'+esc(state.toast)+'</div>':'');
  // 同视图内 render 保持滚动位置；跨视图进入表单则从顶部开始
  const fp = document.querySelector('.form-page');
  if(fp) fp.scrollTop = (lastView==='form') ? savedTop : 0;
  lastView = state.view;
}

  state.hostCode=''; state.hostName=''; state.hostDept=''; state.unit=''; state.reason=''; state.startTime=''; state.endTime='';

function setNoContract(v){ state.noContractReason=v; saveDraft(); }
function setPerson(id,key,v){ const p=state.singlePersons.find(x=>x.id===id); if(p){ p[key]=v; saveDraft(); } }
function addPerson(){ state.singlePersons.push(newPerson()); saveDraft(); render(); }
function removePerson(id){ state.singlePersons=state.singlePersons.filter(p=>p.id!==id); saveDraft(); render(); }
function togglePhoto(id){ const p=state.singlePersons.find(x=>x.id===id); if(p){ p.photo=!p.photo; saveDraft(); } render(); }
function toggleAttachment(){ state.attachment=!state.attachment; saveDraft(); render(); }
function toggleProtocolFile(){ state.protocolFile=!state.protocolFile; saveDraft(); render(); }
function toggleAgreement(){ state.agreementOk=!state.agreementOk; saveDraft(); render(); }
function setTime(which, val){
  val = (val||'').replace('T',' ');
  if(which==='start') state.startTime = val; else state.endTime = val;
  saveDraft(); render();
}
function openNotice(){ state.overlay='notice'; render(); }
function agreeNotice(){ state.agreementOk=true; state.overlay=null; saveDraft(); render(); }
function closeOverlay(){ state.overlay=null; render(); }
function submitForm(){
  const t=TYPES[state.type];
  if(state.type==='visitor'){ clearDraft(); state.view='success'; render(); return; }
  if(!state.agreementOk){ showToast('请阅读并同意《'+t.agreement+'》'); return; }
  if(t.hasContract && state.hasContract==='否' && !state.noContractReason.trim()){ showToast('请填写无合同说明'); return; }
  if(t.fileLabel && !state.protocolFile){ showToast('请上传'+t.fileLabel); return; }
  clearDraft();
  state.view='success'; render();
}

/* 模板导入 */
let lastView = '';
function scrollFormToTop(){
  const el = document.querySelector('.form-page');
  if(el) el.scrollTop = 0;
}
function openImport(){ state.importOpen=true; importState={rows:null,fileName:'',parsing:false}; render(); }
function downloadTemplate(){
  const header = TEMPLATE_FIELDS.map(f=>f.label).join(',');
  const sample = ['张伟,13800001111,320583199001011234,苏E·8X9K2',
                  '李娜,13900002222,310104199203034567,'];
  const csv = '﻿'+[header,...sample].join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='驻场人员导入模板.csv'; a.click();
  showToast('模板已下载（Excel 打开）');
}
function onImportFile(e){
  const f = e.target.files && e.target.files[0];
  importState.fileName = f ? f.name : '示例名单.xlsx';
  render();
}
function pickCell(r, label, k){
  if(r==null) return '';
  if(r[label]!=null && (''+r[label]).trim()!=='') return (''+r[label]).trim();
  if(r[k]!=null && (''+r[k]).trim()!=='') return (''+r[k]).trim();
  for(const key in r){ if(key && key.indexOf(label)>=0) return (''+r[key]).trim(); }
  return '';
}
function parseCsv(text){
  const lines = text.split(/\r?\n/).filter(l=>l.trim()!=='');
  if(!lines.length) return [];
  const header = lines[0].replace(/^﻿/,'').split(',').map(s=>s.trim());
  return lines.slice(1).map(line=>{
    const cells = line.split(',');
    const o={}; header.forEach((h,i)=> o[h] = cells[i]!==undefined ? (cells[i]||'').trim() : '');
    return o;
  });
}
function parseFile(){
  const input = document.querySelector('.imp-file input');
  const f = input && input.files && input.files[0];
  if(!f){ showToast('请先选择文件'); return; }
  if(f.size > 10*1024*1024){ showToast('文件超过 10MB 上限'); return; }
  importState.parsing=true; render();
  const ext = (f.name.split('.').pop()||'').toLowerCase();
  const reader = new FileReader();
  reader.onerror = ()=>{ importState.parsing=false; render(); showToast('文件读取失败'); };
  reader.onload = (e)=>{
    try{
      let raw=[];
      if(ext==='csv'){
        raw = parseCsv(e.target.result);
      } else if(window.XLSX){
        const wb = XLSX.read(e.target.result, {type:'array'});
        raw = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:''});
      } else {
        throw new Error('解析组件未加载，请联网后重试');
      }
      if(raw.length>1000){ importState.parsing=false; render(); showToast('超过 1000 行上限'); return; }
      importState.rows = raw.map(r=>{
        const o={
          name: pickCell(r,'姓名','name'), phone: pickCell(r,'手机号','phone'),
          idcard: pickCell(r,'身份证号','idcard')
        };
        return {name:o.name, phone:o.phone, idcard:o.idcard,
          err: validateRow({phone:o.phone, idcard:o.idcard})};
      });
      importState.parsing=false; render();
      if(!importState.rows.length) showToast('未解析到数据行');
    }catch(err){
      importState.parsing=false; render();
      showToast('解析失败：'+(err&&err.message?err.message:'文件格式错误'));
    }
  };
  if(ext==='csv') reader.readAsText(f,'utf-8'); else reader.readAsArrayBuffer(f);
}
function activePersons(){
  if(state.type==='visitor') return state.singlePersons;
  if(state.personMode==='batch') return state.batchPersons;
  return state.singlePersons;
}
function modeSwitch(){
  const m = state.personMode||'single';
  return '<div class="mode-switch">'
    + '<button class="mode-opt '+(m==='single'?'active':'')+'" onclick="setPersonMode(\'single\')">'+ICON.plus+'单个添加</button>'
    + '<button class="mode-opt '+(m==='batch'?'active':'')+'" onclick="setPersonMode(\'batch\')">'+ICON.download+'批量导入</button>'
    + '</div>';
}
function setPersonMode(m){
  if(state.personMode===m) return;
  state.personMode=m;
  if(m==='single'){
    state.importOpen=false;
    if(!state.singlePersons.length) state.singlePersons=[newPerson()];
  } else {
    // 切到批量导入：无已导入名单时直接展开步骤1
    if(!state.batchPersons.length) state.importOpen=true;
  }
  saveDraft(); render(); scrollFormToTop();
}
function renderPersons(){
  const t = TYPES[state.type];
  // 来访人员：仅单个添加，无批量导入
  if(state.type==='visitor'){
    const persons = state.singlePersons.map((p,i)=>PersonPanel(p,i)).join('');
    return persons + '<button class="add-person" onclick="addPerson()">'+ICON.plus+esc(t.addText)+'</button>';
  }
  // 驻场办公人员 / 施工作业人员：单个添加 与 批量导入 二选一
  const m = state.personMode||'single';
  const sw = modeSwitch();
  if(m==='single'){
    const persons = state.singlePersons.map((p,i)=>PersonPanel(p,i)).join('');
    return sw + persons + '<button class="add-person" onclick="addPerson()">'+ICON.plus+esc(t.addText)+'</button>';
  }
  let body;
  if(state.batchPersons.length && !state.importOpen){
    // 已导入名单 + 重新导入入口
    const list = state.batchPersons.map((p,i)=>'<div class="imp-row ok">'
      + '<span class="ok-tag">'+ICON.check.replace(/width="[^"]*"/,'width="14"').replace(/height="[^"]*"/,'height="14"')+'已导入</span>'
      + '<b>'+esc(p.name)+'</b><small>'+esc(p.phone)+'</small>'
      + '<button class="del" onclick="removeImported('+i+')">移除</button></div>').join('');
    body = '<div class="imp-rows">'+list+'</div>'
      + '<button class="add-person import-btn" onclick="openImport()">'+ICON.download+'重新导入（Excel模板）</button>';
  } else {
    // 批量导入步骤1/步骤2 直接内嵌展示
    body = renderImportSection();
  }
  return sw + body;
}
function removeImported(i){ state.batchPersons.splice(i,1); saveDraft(); render(); }
function reupload(){ importState={rows:null,fileName:'',parsing:false}; render(); }
function exportErrors(){
  const fails = (importState.rows||[]).filter(r=>r.err);
  if(!fails.length){ showToast('无错误行'); return; }
  const header = TEMPLATE_FIELDS.map(f=>f.label).join(',');
  const lines = fails.map(r=>[r.name,r.phone,r.idcard].join(','));
  const csv = '﻿'+[header,...lines].join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='导入错误行.csv'; a.click();
  showToast('已导出 '+fails.length+' 条错误行');
}
function submitPassed(){
  const passed = (importState.rows||[]).filter(r=>!r.err);
  passed.forEach(r=> state.batchPersons.push({id:uid(), name:r.name||'', phone:r.phone||'', idcard:r.idcard||'', photo:false}));
  state.importOpen=false;                       // 回名单视图
  importState={rows:null,fileName:'',parsing:false};
  saveDraft();
  showToast('已导入 '+passed.length+' 人');
}

/* 启动 */
render();
</script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
